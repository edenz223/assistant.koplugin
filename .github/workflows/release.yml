name: Maintain and Release

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'edenz223/assistant.koplugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Git
        run: |
          echo "STATE=$RUNNER_TEMP/maintenance-state.json" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare candidate
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT" != push ]]; then args+=(--sync); fi
          python3 .github/scripts/maintain.py prepare --state "$STATE" "${args[@]}"
      - name: Install official runtime and LuaLS
        if: steps.prepare.outputs.active == 'true'
        run: bash .github/scripts/setup-runtime.sh
      - name: Validate candidate
        if: steps.prepare.outputs.active == 'true'
        run: |
          set -o pipefail
          python3 -m unittest discover -s .github/tests -v
          ./test/run.sh | tee "$RUNNER_TEMP/unit-tests.log"
          command -v lua-language-server
          ./test/run_diagnose.sh | tee "$RUNNER_TEMP/diagnostics.log"
          SDL_VIDEODRIVER=dummy ./test/runui.sh ui/markdown_render
          SDL_VIDEODRIVER=dummy ./test/runui.sh ui/markdown_render_puremd
      - name: Publish validated commit
        if: steps.prepare.outputs.active == 'true'
        run: python3 .github/scripts/maintain.py publish --state "$STATE" --output "$RUNNER_TEMP/release"
      - name: Save failure evidence
        if: failure()
        run: |
          git status --short > "$RUNNER_TEMP/git-status.txt"
          git diff > "$RUNNER_TEMP/candidate.diff"
          git bundle create "$RUNNER_TEMP/candidate.bundle" --all
          git log -8 --oneline > "$RUNNER_TEMP/candidate-history.txt"
          echo 'No unvalidated candidate was published. Inspect the artifact and rerun after resolving the failure.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/maintenance-state.json
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/candidate.*
            ${{ runner.temp }}/candidate-history.txt
            ${{ runner.temp }}/git-status.txt
            ${{ runner.temp }}/assistant_luaserver_log/
            ${{ runner.temp }}/release/
